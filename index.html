<!DOCTYPE HTML>
<html lang="my">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrust Adaptive Issuance Instant ID - Studio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #c standard-grey; display: flex; flex-direction: column; }

        /* NAV & HEADER */
        #top-navbar {
            height: 42px;
            background-color: #ffffff;
            border-bottom: 1px solid #dcdcdc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 13px;
        }
        .brand-logo { font-weight: bold; color: #5c2483; font-size: 15px; display: flex; align-items: center; gap: 6px; }
        .nav-menu { display: flex; gap: 15px; align-items: center; }
        .nav-item { color: #374151; cursor: pointer; font-weight: 500; text-decoration: none; }

        /* PURPLE BANNER */
        .page-banner { 
            background: linear-gradient(90deg, #6b21a8 0%, #86198f 100%); 
            color: #ffffff; 
            padding: 6px 15px; 
            font-size: 14px; 
            font-weight: 500; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        .edit-title-btn {
            background: #ffffff;
            color: #6b21a8;
            border: none;
            border-radius: 2px;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
        }

        /* TOOLBAR MATCHING THE IMAGE */
        .design-toolbar { 
            background-color: #cfd3d8; 
            border-bottom: 1px solid #b0b5bc; 
            padding: 4px 8px; 
            display: flex; 
            align-items: center; 
            gap: 2px; 
        }
        .tool-group {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #a3a8b0;
            border-radius: 2px;
        }
        .tool-btn { 
            width: 26px; 
            height: 26px; 
            background-color: #ffffff; 
            border: none;
            border-right: 1px solid #e5e7eb;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 12px; 
            color: #374151; 
        }
        .tool-group .tool-btn:last-child { border-right: none; }
        .tool-btn:hover { background-color: #e2e8f0; }
        .tool-spacer { width: 6px; }

        .zoom-select { height: 26px; font-size: 11px; border: 1px solid #a3a8b0; padding: 0 4px; border-radius: 2px; background: #fff; }

        /* CANVAS SUB-HEADER */
        .canvas-subheader {
            background-color: #e2e8f0;
            padding: 6px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            border-bottom: 1px solid #cbd5e1;
        }

        /* WORKSPACE & CANVAS */
        .studio-workspace { flex: 1; display: flex; background-color: #94a3b8; overflow: hidden; }
        .canvas-area { flex: 1; padding: 20px; display: flex; gap: 30px; overflow: auto; justify-content: center; align-items: flex-start; }
        .card-canvas-outer { width: 340px; height: 220px; background-color: #64748b; display: flex; align-items: center; justify-content: center; border: 1px solid #475569; }
        .id-card { width: 300px; height: 180px; background-color: #ffffff; border-radius: 4px; border: 1px solid #334155; }
        
        /* PROPERTIES SIDEBAR */
        .properties-sidebar { width: 240px; background-color: #f8fafc; border-left: 1px solid #cbd5e1; display: flex; flex-direction: column; }
        .sidebar-tabs { display: flex; background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; }
        .sidebar-tab { flex: 1; padding: 8px; text-align: center; font-size: 12px; color: #475569; cursor: pointer; }
        .sidebar-tab.active { background-color: #f8fafc; font-weight: bold; color: #0f172a; border-bottom: 2px solid #6b21a8; }
        .sidebar-content { padding: 12px; font-size: 12px; color: #334155; }
    </style>
</head>
<body>

    <div id="top-navbar">
        <div class="brand-logo"><i class="fa-solid fa-cube"></i> ENTRUST</div>
        <div class="nav-menu">
            <a class="nav-item">Home</a>
            <a class="nav-item">Design ▼</a>
            <a class="nav-item">Printer Queues</a>
        </div>
        <div style="font-size: 12px; color: #4b5563;">admin ▼</div>
    </div>

    <div class="page-banner">
        <span>Credential Design 1</span>
        <button class="edit-title-btn"><i class="fa-solid fa-pen"></i></button>
    </div>

    <div class="design-toolbar">
        <div class="tool-group">
            <button class="tool-btn" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="tool-btn" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <div class="tool-spacer"></div>

        <div class="tool-group">
            <button class="tool-btn" title="Duplicate"><i class="fa-regular fa-clone"></i></button>
            <button class="tool-btn" title="Cut"><i class="fa-solid fa-scissors"></i></button>
            <button class="tool-btn" title="Paste"><i class="fa-regular fa-paste"></i></button>
        </div>
        <div class="tool-spacer"></div>

        <div class="tool-group">
            <button class="tool-btn" title="Static Text"><i class="fa-solid fa-font"></i></button>
            <button class="tool-btn" title="Dynamic Text"><span style="font-weight: bold; font-size: 11px;">T_</span></button>
        </div>
        <div class="tool-spacer"></div>

        <div class="tool-group">
            <button class="tool-btn" title="Photo Field"><i class="fa-solid fa-id-badge"></i></button>
            <button class="tool-btn" title="Static Image"><i class="fa-regular fa-image"></i></button>
            <button class="tool-btn" title="Dynamic Image"><i class="fa-solid fa-image"></i></button>
            <button class="tool-btn" title="Signature Field"><i class="fa-solid fa-signature"></i></button>
            <button class="tool-btn" title="Fingerprint Field"><i class="fa-solid fa-fingerprint"></i></button>
        </div>
        <div class="tool-spacer"></div>

        <div class="tool-group">
            <button class="tool-btn" title="Barcode"><i class="fa-solid fa-barcode"></i></button>
            <button class="tool-btn" title="Magnetic Stripe"><i class="fa-solid fa-credit-card"></i></button>
            <button class="tool-btn" title="Smart Chip"><i class="fa-solid fa-sim-card"></i></button>
        </div>
        <div class="tool-spacer"></div>

        <div class="tool-group">
            <button class="tool-btn" title="Line"><i class="fa-solid fa-slash"></i></button>
            <button class="tool-btn" title="Rectangle"><i class="fa-regular fa-square"></i></button>
            <button class="tool-btn" title="Circle"><i class="fa-regular fa-circle"></i></button>
        </div>
        <div class="tool-spacer"></div>

        <div class="tool-group">
            <button class="tool-btn" title="Rulers"><i class="fa-solid fa-ruler-combined"></i></button>
            <button class="tool-btn" title="Grid"><i class="fa-solid fa-border-all"></i></button>
        </div>
        <div class="tool-spacer"></div>

        <div class="tool-group">
            <button class="tool-btn" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <button class="tool-btn" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        </div>
        <span style="font-size: 11px; color: #374151; margin-left: 4px;">Zoom</span>
        <select class="zoom-select"><option>100%</option></select>
        <div class="tool-spacer"></div>

        <div class="tool-group">
            <button class="tool-btn" title="Split View"><i class="fa-solid fa-table-columns"></i></button>
        </div>
    </div>

    <div class="canvas-subheader">
        <span>Front Side</span>
        <span>Active Design Layer: Color</span>
        <span>Back Side</span>
    </div>

    <div class="studio-workspace">
        <div class="canvas-area">
            <div class="card-canvas-outer"><div class="id-card"></div></div>
            <div class="card-canvas-outer"><div class="id-card"></div></div>
        </div>

        <div class="properties-sidebar">
            <div class="sidebar-tabs">
                <div class="sidebar-tab active">Properties</div>
                <div class="sidebar-tab">Layers</div>
            </div>
            <div class="sidebar-content">
                <label><input type="checkbox"> Rotate print orientation 180 degrees</label><br><br>
                <label><input type="checkbox"> Tactile Impression Module</label>
            </div>
        </div>
    </div>

</body>
</html>
