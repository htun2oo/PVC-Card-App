<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVC Card Studio & Product Builder</title>
    <!-- Fabric.js Canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #2c3e50; color: white; padding: 12px 20px; text-align: center; }
        
        /* Top Toolbar Styling */
        .toolbar {
            background: #ffffff; border-bottom: 1px solid #ddd; padding: 8px 20px;
            display: flex; gap: 15px; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tool-group { display: flex; align-items: center; gap: 8px; border-right: 1px solid #eee; padding-right: 15px; }
        .tool-group label { font-size: 12px; font-weight: bold; color: #666; }
        .tool-btn {
            padding: 6px 12px; border: 1px solid #ccc; background: #fff; border-radius: 4px;
            cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s;
        }
        .tool-btn:hover { background: #eef2f5; border-color: #bbb; }
        .tool-select, .tool-input { padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }

        /* Main Container */
        .container { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar Tools */
        .sidebar { width: 300px; background: white; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; }
        .sidebar h3 { margin-bottom: 12px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; font-size: 16px; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        .control-group input[type="text"], .control-group input[type="number"] {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
        }
        .btn {
            width: 100%; padding: 9px; border: none; border-radius: 4px; background-color: #3498db;
            color: white; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; }

        /* Workspace Area */
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #eef2f5; padding: 20px; }
        .canvas-container-wrapper { box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; background: white; }
        .canvas-controls { margin-top: 15px; display: flex; gap: 10px; }

        /* Product Gallery */
        .product-panel { width: 280px; background: white; border-left: 1px solid #ddd; padding: 20px; overflow-y: auto; }
        .product-card { border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-bottom: 15px; background: #fafafa; }
        .product-card img { width: 100%; border-radius: 4px; border: 1px solid #ddd; }
        .product-card h4 { margin: 5px 0; color: #2c3e50; font-size: 14px; }
        .product-card p { font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <header>
        <h2>PVC Card Studio & Product Builder</h2>
    </header>

    <!-- TOP TOOLBAR -->
    <div class="toolbar">
        <!-- Font Options -->
        <div class="tool-group">
            <label>Font:</label>
            <select id="fontFamily" class="tool-select" onchange="changeFontFamily(this.value)">
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>
                <option value="Impact">Impact</option>
                <option value="Georgia">Georgia</option>
            </select>
            <input type="number" id="fontSize" class="tool-input" value="20" min="8" max="120" style="width: 55px;" onchange="changeFontSize(this.value)">
        </div>

        <!-- Text Style Buttons -->
        <div class="tool-group">
            <button class="tool-btn" onclick="toggleBold()"><b>B</b></button>
            <button class="tool-btn" onclick="toggleItalic()"><i>I</i></button>
            <button class="tool-btn" onclick="toggleUnderline()"><u>U</u></button>
        </div>

        <!-- Color Options -->
        <div class="tool-group">
            <label>Color:</label>
            <input type="color" id="objColor" value="#000000" onchange="changeObjectColor(this.value)">
        </div>

        <!-- Alignment -->
        <div class="tool-group">
            <button class="tool-btn" onclick="alignText('left')">← Left</button>
            <button class="tool-btn" onclick="alignText('center')">↔ Center</button>
            <button class="tool-btn" onclick="alignText('right')">Right →</button>
        </div>

        <!-- Layer Control -->
        <div class="tool-group">
            <button class="tool-btn" onclick="bringToFront()">Bring Front</button>
            <button class="tool-btn" onclick="sendToBack()">Send Back</button>
        </div>

        <!-- Delete Action -->
        <div class="tool-group">
            <button class="tool-btn" style="color: red;" onclick="deleteSelected()">🗑 Delete</button>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Card Background</h3>
            <div class="control-group">
                <label>Background Color</label>
                <input type="color" id="bgColor" value="#ffffff" onchange="changeBgColor(this.value)">
            </div>

            <h3>Add Elements</h3>
            <div class="control-group">
                <button class="btn" onclick="addText()">+ Add Text</button>
            </div>
            <div class="control-group">
                <label>Upload Image / Logo</label>
                <input type="file" id="imageLoader" accept="image/*" onchange="uploadImage(event)">
            </div>

            <h3>Save as Product</h3>
            <div class="control-group">
                <label>Product Title</label>
                <input type="text" id="prodTitle" placeholder="e.g. Employee ID Card">
            </div>
            <div class="control-group">
                <label>Price (MMK/USD)</label>
                <input type="number" id="prodPrice" placeholder="5000">
            </div>
            <button class="btn btn-success" onclick="saveProduct()">Save Product</button>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div class="canvas-container-wrapper">
                <canvas id="cardCanvas" width="646" height="408"></canvas>
            </div>

            <div class="canvas-controls">
                <button class="btn" style="background:#555;" onclick="exportImage()">Download PNG (High-Res)</button>
                <button class="btn" style="background:#555;" onclick="exportPDF()">Download PDF</button>
            </div>
        </div>

        <!-- Saved Products Panel -->
        <div class="product-panel">
            <h3>Saved Products</h3>
            <div id="productList">
                <p style="color: #888; font-size: 13px;">No products saved yet.</p>
            </div>
        </div>
    </div>

    <script>
        // Initialize Fabric Canvas
        const canvas = new fabric.Canvas('cardCanvas');
        canvas.setBackgroundColor('#ffffff', canvas.renderAll.bind(canvas));

        // Load Initial Layout Template
        function loadDefaultTemplate() {
            const header = new fabric.Rect({
                left: 0, top: 0, fill: '#1e3799',
                width: 646, height: 80, selectable: true
            });
            canvas.add(header);

            const title = new fabric.IText('COMPANY NAME', {
                left: 30, top: 25, fill: '#ffffff',
                fontSize: 24, fontWeight: 'bold', fontFamily: 'Arial'
            });
            canvas.add(title);

            const name = new fabric.IText('CARD HOLDER NAME', {
                left: 200, top: 140, fill: '#333333',
                fontSize: 20, fontWeight: 'bold', fontFamily: 'Arial'
            });
            canvas.add(name);

            const photoBox = new fabric.Rect({
                left: 30, top: 110, fill: '#e0e0e0', stroke: '#cccccc',
                strokeWidth: 2, width: 140, height: 180, rx: 8, ry: 8
            });
            canvas.add(photoBox);
        }

        loadDefaultTemplate();

        // ---------------- TOOLBAR FUNCTIONS ----------------

        // 1. Font Family
        function changeFontFamily(family) {
            const active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('fontFamily', family);
                canvas.renderAll();
            }
        }

        // 2. Font Size
        function changeFontSize(size) {
            const active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('fontSize', parseInt(size));
                canvas.renderAll();
            }
        }

        // 3. Bold, Italic, Underline
        function toggleBold() {
            const active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('fontWeight', active.fontWeight === 'bold' ? 'normal' : 'bold');
                canvas.renderAll();
            }
        }

        function toggleItalic() {
            const active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('fontStyle', active.fontStyle === 'italic' ? 'normal' : 'italic');
                canvas.renderAll();
            }
        }

        function toggleUnderline() {
            const active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('underline', !active.underline);
                canvas.renderAll();
            }
        }

        // 4. Object Color
        function changeObjectColor(color) {
            const active = canvas.getActiveObject();
            if (active) {
                active.set('fill', color);
                canvas.renderAll();
            }
        }

        // 5. Alignments
        function alignText(alignment) {
            const active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('textAlign', alignment);
                canvas.renderAll();
            }
        }

        // 6. Layer Control
        function bringToFront() {
            const active = canvas.getActiveObject();
            if (active) {
                canvas.bringToFront(active);
                canvas.renderAll();
            }
        }

        function sendToBack() {
            const active = canvas.getActiveObject();
            if (active) {
                canvas.sendToBack(active);
                canvas.renderAll();
            }
        }

        // 7. Sync Toolbar Controls with Selected Object
        canvas.on('selection:created', updateToolbar);
        canvas.on('selection:updated', updateToolbar);

        function updateToolbar() {
            const active = canvas.getActiveObject();
            if (active) {
                if (active.fill) document.getElementById('objColor').value = active.fill;
                if (active.type === 'i-text') {
                    document.getElementById('fontFamily').value = active.fontFamily || 'Arial';
                    document.getElementById('fontSize').value = active.fontSize || 20;
                }
            }
        }

        // ---------------- SIDEBAR FUNCTIONS ----------------

        function changeBgColor(color) {
            canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        }

        function addText() {
            const text = new fabric.IText('New Text', {
                left: 100, top: 100, fill: '#000000', fontSize: 20, fontFamily: 'Arial'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function uploadImage(e) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const imgObj = new Image();
                imgObj.src = event.target.result;
                imgObj.onload = function () {
                    const image = new fabric.Image(imgObj);
                    image.scaleToWidth(120);
                    image.set({ left: 50, top: 50 });
                    canvas.add(image);
                    canvas.setActiveObject(image);
                }
            }
            if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        }

        function deleteSelected() {
            const active = canvas.getActiveObject();
            if (active) canvas.remove(active);
        }

        // ---------------- EXPORT & PRODUCT FUNCTIONS ----------------

        function exportImage() {
            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 3 });
            const link = document.createElement('a');
            link.download = 'pvc-card-design.png';
            link.href = dataURL;
            link.click();
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 53.9] });
            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 3 });
            pdf.addImage(dataURL, 'PNG', 0, 0, 85.6, 53.9);
            pdf.save('pvc-card.pdf');
        }

        const products = [];
        function saveProduct() {
            const title = document.getElementById('prodTitle').value;
            const price = document.getElementById('prodPrice').value;

            if (!title || !price) {
                alert('Please enter product title and price!');
                return;
            }

            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 1 });
            products.push({ id: Date.now(), title, price, image: dataURL });

            const listContainer = document.getElementById('productList');
            listContainer.innerHTML = '';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `<img src="${p.image}"><h4>${p.title}</h4><p>Price: ${p.price} MMK</p>`;
                listContainer.appendChild(card);
            });

            document.getElementById('prodTitle').value = '';
            document.getElementById('prodPrice').value = '';
        }
    </script>
</body>
</html>
