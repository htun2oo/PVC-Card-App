<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVC Card Design & Product Maker</title>
    <!-- Fabric.js Library for Canvas Editing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #2c3e50; color: white; padding: 15px 20px; text-align: center; }
        .container { display: flex; height: calc(100vh - 60px); }
        
        /* Sidebar Tools */
        .sidebar { width: 320px; background: white; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; }
        .sidebar h3 { margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .control-group input[type="text"], .control-group input[type="number"], .control-group select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px; background-color: #3498db;
            color: white; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-secondary { background-color: #7f8c8d; }

        /* Workspace Area */
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #eef2f5; padding: 20px; position: relative; }
        .canvas-container-wrapper {
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }
        .canvas-controls { margin-top: 15px; display: flex; gap: 10px; }

        /* Product Gallery */
        .product-panel { width: 300px; background: white; border-left: 1px solid #ddd; padding: 20px; overflow-y: auto; }
        .product-card { border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-bottom: 15px; background: #fafafa; }
        .product-card img { width: 100%; border-radius: 4px; border: 1px solid #ddd; }
        .product-card h4 { margin: 5px 0; color: #2c3e50; }
        .product-card p { font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <header>
        <h2>PVC Card Studio & Product Builder</h2>
    </header>

    <div class="container">
        <!-- Sidebar: Tools & Control -->
        <div class="sidebar">
            <h3>Card Settings</h3>
            <div class="control-group">
                <label>Background Color</label>
                <input type="color" id="bgColor" value="#ffffff" onchange="changeBgColor(this.value)">
            </div>

            <h3>Add Elements</h3>
            <div class="control-group">
                <button class="btn" onclick="addText()">+ Add Text</button>
            </div>
            <div class="control-group">
                <label>Upload Image / Logo</label>
                <input type="file" id="imageLoader" accept="image/*" onchange="uploadImage(event)">
            </div>

            <h3>Selected Element</h3>
            <div class="control-group">
                <label>Text / Object Color</label>
                <input type="color" id="objColor" value="#000000" onchange="changeObjectColor(this.value)">
            </div>
            <div class="control-group">
                <button class="btn btn-danger" onclick="deleteSelected()">Delete Selected</button>
            </div>

            <h3>Save as Product</h3>
            <div class="control-group">
                <label>Product Title</label>
                <input type="text" id="prodTitle" placeholder="e.g. Employee ID Card">
            </div>
            <div class="control-group">
                <label>Price ($/MMK)</label>
                <input type="number" id="prodPrice" placeholder="5000">
            </div>
            <button class="btn btn-success" onclick="saveProduct()">Save Product</button>
        </div>

        <!-- Middle Workspace (PVC Card Canvas) -->
        <div class="workspace">
            <!-- Canvas Standard CR80 Ratio: 85.6mm x 53.9mm -> 323px x 204px (Scaled up 2x for Editor: 646px x 408px) -->
            <div class="canvas-container-wrapper">
                <canvas id="cardCanvas" width="646" height="408"></canvas>
            </div>

            <div class="canvas-controls">
                <button class="btn btn-secondary" onclick="exportImage()">Download PNG (Print Ready)</button>
                <button class="btn btn-secondary" onclick="exportPDF()">Download PDF</button>
            </div>
        </div>

        <!-- Right Panel: Saved Products -->
        <div class="product-panel">
            <h3>Saved Products</h3>
            <div id="productList">
                <p style="color: #888; font-size: 13px;">No products saved yet.</p>
            </div>
        </div>
    </div>

    <script>
        // Initialize Fabric Canvas
        const canvas = new fabric.Canvas('cardCanvas');
        canvas.setBackgroundColor('#ffffff', canvas.renderAll.bind(canvas));

        // Add Initial Template Elements (Default Design)
        function loadDefaultTemplate() {
            // Header Bar
            const header = new fabric.Rect({
                left: 0, top: 0, fill: '#1e3799',
                width: 646, height: 80, selectable: true
            });
            canvas.add(header);

            // Title Text
            const title = new fabric.IText('COMPANY NAME', {
                left: 30, top: 25, fill: '#ffffff',
                fontSize: 24, fontWeight: 'bold', fontFamily: 'Arial'
            });
            canvas.add(title);

            // Sample Name
            const name = new fabric.IText('CARD HOLDER NAME', {
                left: 200, top: 140, fill: '#333333',
                fontSize: 20, fontWeight: 'bold', fontFamily: 'Arial'
            });
            canvas.add(name);

            // Sample Role
            const role = new fabric.IText('Graphic Designer', {
                left: 200, top: 175, fill: '#666666',
                fontSize: 16, fontFamily: 'Arial'
            });
            canvas.add(role);

            // Photo Placeholder
            const photoBox = new fabric.Rect({
                left: 30, top: 110, fill: '#e0e0e0', stroke: '#cccccc',
                strokeWidth: 2, width: 140, height: 180, rx: 8, ry: 8
            });
            canvas.add(photoBox);

            const photoText = new fabric.Text('Photo\nHere', {
                left: 70, top: 180, fill: '#888888',
                fontSize: 14, textAlign: 'center'
            });
            canvas.add(photoText);
        }

        loadDefaultTemplate();

        // 1. Background Color Change
        function changeBgColor(color) {
            canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        }

        // 2. Add Text
        function addText() {
            const text = new fabric.IText('Double click to edit', {
                left: 100, top: 100, fill: '#000000', fontSize: 18, fontFamily: 'Arial'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        // 3. Upload Image
        function uploadImage(e) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const imgObj = new Image();
                imgObj.src = event.target.result;
                imgObj.onload = function () {
                    const image = new fabric.Image(imgObj);
                    image.scaleToWidth(120);
                    image.set({ left: 50, top: 50 });
                    canvas.add(image);
                    canvas.setActiveObject(image);
                }
            }
            if (e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        // 4. Change Selected Object Color
        function changeObjectColor(color) {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                activeObject.set('fill', color);
                canvas.renderAll();
            }
        }

        // 5. Delete Selected Object
        function deleteSelected() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                canvas.remove(activeObject);
            }
        }

        // 6. Export to High-Res PNG
        function exportImage() {
            const dataURL = canvas.toDataURL({
                format: 'png',
                multiplier: 3 // High resolution output for PVC printing
            });
            const link = document.createElement('a');
            link.download = 'pvc-card-design.png';
            link.href = dataURL;
            link.click();
        }

        // 7. Export to PDF (CR80 standard size in mm)
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: [85.6, 53.9] // PVC Card Standard Dimension
            });

            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 3 });
            pdf.addImage(dataURL, 'PNG', 0, 0, 85.6, 53.9);
            pdf.save('pvc-card.pdf');
        }

        // 8. Product Save Management
        const products = [];

        function saveProduct() {
            const title = document.getElementById('prodTitle').value;
            const price = document.getElementById('prodPrice').value;

            if (!title || !price) {
                alert('Please enter product title and price!');
                return;
            }

            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 1 });
            const product = { id: Date.now(), title, price, image: dataURL };
            products.push(product);

            renderProducts();
            
            // Clear inputs
            document.getElementById('prodTitle').value = '';
            document.getElementById('prodPrice').value = '';
        }

        function renderProducts() {
            const listContainer = document.getElementById('productList');
            listContainer.innerHTML = '';

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image}" alt="${p.title}">
                    <h4>${p.title}</h4>
                    <p>Price: ${p.price} MMK/USD</p>
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
