<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Issuance Instant ID - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Purple Gradient Background Setup */
        body {
            height: 100vh;
            background: linear-gradient(135deg, #7026b9 0%, #4a1582 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* App Title Header */
        .app-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Login Card Container */
        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            width: 480px;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Yellow Warning Banner */
        .warning-banner {
            background-color: #e5a043;
            color: #2c1a00;
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .warning-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 380px;
        }
        .banner-icons {
            display: flex;
            gap: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Form Group Inputs */
        .form-group {
            width: 100%;
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #555555;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #7c8ba1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #6200ee;
        }

        /* Forgot Password Link */
        .forgot-password {
            color: #ffffff;
            font-size: 14px;
            text-decoration: underline;
            margin-top: 18px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .forgot-password:hover {
            color: #e0e0e0;
        }

        /* Sign In Button */
        .btn-signin {
            background-color: #00b0eb;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        .btn-signin:hover {
            background-color: #0088b8;
        }
    </style>
</head>
<body>

    <!-- Header Title -->
    <div class="app-title">Adaptive Issuance<br>Instant ID</div>

    <!-- Login Box Panel -->
    <div class="login-card">
        
        <!-- Expired Warning Notification -->
        <div class="warning-banner" id="warningBanner">
            <span class="warning-text">Your session expired due to inactivity. You will n ...</span>
            <div class="banner-icons">
                <span title="Details">+</span>
                <span title="Close" onclick="document.getElementById('warningBanner').style.display='none'">×</span>
            </div>
        </div>

        <!-- Input Fields -->
        <div class="form-group">
            <label for="userId">User ID</label>
            <input type="text" id="userId" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password">
        </div>

    </div>

    <!-- Actions Below Card -->
    <a class="forgot-password" onclick="alert('Forgot Password Link Clicked')">Forgot Password?</a>
    <button class="btn-signin" onclick="handleLogin()">Sign In</button>

    <script>
        function handleLogin() {
            const user = document.getElementById('userId').value;
            const pass = document.getElementById('password').value;
            
            if (!user || !pass) {
                alert('ကျေးဇူးပြု၍ User ID နှင့် Password ထည့်သွင်းပါ။');
                return;
            }
            alert('Login MDI Application သို့ ဝင်ရောက်နေပါသည်...');
        }
    </script>
</body>
</html>
