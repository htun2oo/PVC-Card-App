<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRUST Adaptive Issuance Instant ID</title>
    <!-- Fabric.js Canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #808080;
        }

        /* ---------------- LOGIN PAGE ---------------- */
        #login-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #7026b9 0%, #4a1582 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000000;
        }

        .app-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            width: 440px;
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .form-group { width: 100%; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #9aa0a6; border-radius: 6px; font-size: 15px; outline: none; }

        .forgot-password { color: #fff; font-size: 14px; text-decoration: underline; margin-top: 20px; margin-bottom: 15px; cursor: pointer; }
        .btn-signin { background-color: #00b0eb; color: #fff; border: none; padding: 10px 26px; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        /* ---------------- TOP NAVBAR ---------------- */
        #top-navbar {
            height: 48px;
            background-color: #ffffff;
            border-bottom: 1px solid #dcdcdc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 13px;
        }

        .nav-left { display: flex; align-items: center; gap: 25px; }
        .brand-logo { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #2c1a00; }
        .brand-logo svg { width: 22px; height: 22px; fill: #5c2483; }
        .brand-title { font-size: 12px; color: #555; border-left: 1px solid #ccc; padding-left: 10px; line-height: 1.2; }
        .nav-menu { display: flex; gap: 20px; }
        .nav-item { color: #333; text-decoration: none; cursor: pointer; font-weight: 500; }
        .nav-right { display: flex; align-items: center; gap: 15px; font-size: 11px; color: #666; }
        .user-profile { display: flex; align-items: center; gap: 8px; cursor: pointer; }

        /* ---------------- SUB TAB BAR ---------------- */
        #sub-navbar {
            height: 38px;
            background-color: #5c2483;
            display: flex;
            align-items: flex-end;
            padding-left: 20px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 16px;
            font-size: 12px;
            border: none;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            margin-right: 4px;
            cursor: pointer;
        }

        .tab-btn.active { background: #ffffff; color: #333333; font-weight: bold; }

        /* ---------------- ACTION BAR ---------------- */
        #action-bar {
            height: 36px;
            background-color: #e0e0e0;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 5px;
        }

        .action-btn { background: #ffffff; border: 1px solid #bbb; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; }

        /* ---------------- MAIN WORKSPACE ---------------- */
        #main-workspace {
            display: none;
            flex-direction: column;
            height: 100vh; width: 100vw;
            position: fixed; top: 0; left: 0;
            z-index: 999999;
        }

        .workspace-content {
            flex: 1;
            padding: 10px;
            position: relative;
            background-color: #d1d5db;
            overflow: hidden;
        }

        /* SINGLE UNIFIED WINDOW STYLES */
        .single-window {
            width: 100%;
            height: 100%;
            background: #ece9d8;
            border: 2px solid #ffffff;
            border-right-color: #404040;
            border-bottom-color: #404040;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.2s ease-in-out;
        }

        .window-titlebar {
            background: linear-gradient(90deg, #0a246a, #a6caf0);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .window-controls { display: flex; gap: 3px; }
        .win-btn {
            width: 18px;
            height: 16px;
            background: #ece9d8;
            border: 1px solid #fff;
            border-right-color: #404040;
            border-bottom-color: #404040;
            font-size: 10px;
            line-height: 12px;
            text-align: center;
            color: #000;
            cursor: pointer;
            font-weight: bold;
        }

        .window-body {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #d4d0c8;
            overflow: auto;
        }

        .left-form-area {
            flex: 1;
            background: #ece9d8;
            border: 1px solid #808080;
            border-radius: 2px;
        }

        .right-card-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-preview-box {
            flex: 1;
            background: #808080;
            border: 1px solid #404040;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: #ffffff;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }

        /* WINDOW STATES */
        .single-window.minimized {
            height: 30px !important;
            overflow: hidden;
        }
        .single-window.minimized .window-body { display: none; }

        .single-window.closed { display: none !important; }

        .restore-bar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 200;
        }
        .restore-btn {
            background: #ece9d8;
            border: 2px solid #fff;
            border-right-color: #404040;
            border-bottom-color: #404040;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="app-title">Adaptive Issuance<br>Instant ID</div>

        <div class="login-card">
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" value="admin" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="1234">
            </div>
        </div>

        <a class="forgot-password" onclick="alert('Password reset link sent!')">Forgot Password?</a>
        <button class="btn-signin" onclick="handleLogin()">Sign In</button>
    </div>

    <!-- MAIN WORKSPACE -->
    <div id="main-workspace">
        
        <!-- Top Header (Last Login Info Removed) -->
        <div id="top-navbar">
            <div class="nav-left">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <span>ENTRUST</span>
                </div>
                <div class="brand-title">Adaptive Issuance™<br><b>Instant ID</b></div>
                <div class="nav-menu">
                    <a class="nav-item">Home</a>
                    <a class="nav-item">Design ▾</a>
                    <a class="nav-item">Printer Queues</a>
                </div>
            </div>

            <div class="nav-right">
                <div class="user-profile">
                    <span>admin ▾</span>
                    <span>⚙</span>
                    <span>🔔</span>
                    <span>👤</span>
                </div>
            </div>
        </div>

        <!-- Sub Tabs -->
        <div id="sub-navbar">
            <button class="tab-btn active">Credentials</button>
            <button class="tab-btn">Reports</button>
        </div>

        <!-- Action Bar -->
        <div id="action-bar">
            <button class="action-btn">🔲</button>
            <button class="action-btn">☰</button>
        </div>

        <!-- Workspace Area with Single Window -->
        <div class="workspace-content">
            <div class="single-window" id="appWindow">
                <!-- Titlebar with Minimize, Maximize, Close Buttons -->
                <div class="window-titlebar">
                    <span>Credentials Workspace</span>
                    <div class="window-controls">
                        <div class="win-btn" onclick="toggleMinimize()">_</div>
                        <div class="win-btn" onclick="toggleMaximize()">□</div>
                        <div class="win-btn" onclick="closeWindow()">×</div>
                    </div>
                </div>

                <!-- Unified Content Body -->
                <div class="window-body">
                    <!-- Production Form Area -->
                    <div class="left-form-area"></div>

                    <!-- Cards Front/Back Preview Area -->
                    <div class="right-card-area">
                        <div class="card-preview-box">
                            <canvas id="frontCanvas" width="320" height="190"></canvas>
                        </div>
                        <div class="card-preview-box">
                            <canvas id="backCanvas" width="320" height="190"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="restore-bar" id="restoreBar"></div>
        </div>

    </div>

    <script>
        function triggerFullScreen() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
            else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
        }

        function handleLogin() {
            const user = document.getElementById('userId').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === "admin" && pass === "1234") {
                triggerFullScreen();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-workspace').style.display = 'flex';
                initCanvases();
            } else {
                alert('User ID သို့မဟုတ် Password မှားယွင်းနေပါသည်။ (Default: admin / 1234)');
            }
        }

        // Window Controls (Minimize, Maximize, Close)
        let isMaximized = false;
        function toggleMinimize() {
            const win = document.getElementById('appWindow');
            win.classList.toggle('minimized');
        }

        function toggleMaximize() {
            const win = document.getElementById('appWindow');
            if (!isMaximized) {
                win.style.position = 'fixed';
                win.style.top = '122px';
                win.style.left = '0';
                win.style.width = '100vw';
                win.style.height = 'calc(100vh - 122px)';
                win.style.zIndex = '1000';
                isMaximized = true;
            } else {
                win.style.position = 'relative';
                win.style.top = 'auto';
                win.style.left = 'auto';
                win.style.width = '100%';
                win.style.height = '100%';
                win.style.zIndex = 'auto';
                isMaximized = false;
            }
        }

        function closeWindow() {
            document.getElementById('appWindow').classList.add('closed');
            const restoreBar = document.getElementById('restoreBar');
            restoreBar.innerHTML = `<button class="restore-btn" onclick="restoreWindow()">Reopen Workspace</button>`;
        }

        function restoreWindow() {
            const win = document.getElementById('appWindow');
            win.classList.remove('closed', 'minimized');
            document.getElementById('restoreBar').innerHTML = '';
        }

        // Canvas Setup
        let frontCanvas, backCanvas;
        function initCanvases() {
            if (frontCanvas) return;

            frontCanvas = new fabric.Canvas('frontCanvas');
            frontCanvas.setBackgroundColor('#ffffff', frontCanvas.renderAll.bind(frontCanvas));
            frontCanvas.add(
                new fabric.Rect({ left: 0, top: 0, fill: '#1e3799', width: 320, height: 35 }),
                new fabric.IText('COMPANY NAME', { left: 10, top: 8, fill: '#ffffff', fontSize: 12, fontWeight: 'bold' }),
                new fabric.Rect({ left: 10, top: 45, fill: '#e0e0e0', stroke: '#aaa', strokeWidth: 1, width: 75, height: 95, rx: 3, ry: 3 })
            );

            backCanvas = new fabric.Canvas('backCanvas');
            backCanvas.setBackgroundColor('#ffffff', backCanvas.renderAll.bind(backCanvas));
            backCanvas.add(
                new fabric.Rect({ left: 0, top: 12, fill: '#111111', width: 320, height: 30 }),
                new fabric.IText('This card is non-transferable.', { left: 12, top: 55, fill: '#666666', fontSize: 8 }),
                new fabric.Rect({ left: 12, top: 95, fill: '#000000', width: 180, height: 25 })
            );
        }
    </script>
</body>
</html>
